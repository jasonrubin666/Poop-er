<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>POOP-ER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  font-family: 'Press Start 2P', monospace;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  image-rendering: pixelated;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---- GAME CANVAS AREA ---- */
#game-area {
  position: relative;
  flex-shrink: 0;
}

#game-area canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  width: 100%;
  height: 100%;
  border: 3px solid #ffcc00;
  box-shadow: 0 0 15px #ffcc0044;
}

/* ---- HUD (lives, score) drawn on canvas ---- */

/* ---- TITLE / GAME-OVER OVERLAYS ---- */
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.88);
  z-index: 20;
  cursor: pointer;
}

.overlay.hidden { display: none; }

.overlay .poop-art {
  font-size: min(15vw, 64px);
  margin-bottom: 12px;
  animation: bounce 0.8s infinite alternate;
}

.overlay h1 {
  font-size: min(8vw, 32px);
  color: #8B6914;
  text-shadow: 3px 3px #000, -1px -1px #ffcc00;
  margin-bottom: 6px;
  animation: pulse 1.5s infinite;
}

.overlay .subtitle {
  font-size: min(2.5vw, 10px);
  color: #ffcc00;
  margin-bottom: 24px;
}

.overlay h2 {
  font-size: min(7vw, 26px);
  color: #ff4444;
  text-shadow: 2px 2px #000;
  margin-bottom: 12px;
}

.overlay .final-score {
  font-size: min(3.5vw, 14px);
  color: #ffcc00;
  margin-bottom: 8px;
}

.overlay .new-hi {
  font-size: min(3vw, 12px);
  color: #ff6600;
  animation: pulse 0.5s infinite;
  margin-bottom: 12px;
}

.blink {
  font-size: min(3vw, 12px);
  color: #fff;
  animation: blink 1s infinite;
  margin-top: 16px;
  padding: 12px 20px;
}

.controls-info {
  font-size: min(2vw, 8px);
  color: #888;
  margin-top: 14px;
  text-align: center;
  line-height: 2;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

/* ---- D-PAD (always visible, below canvas) ---- */
#controls {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  gap: 6px;
  padding: 10px;
  width: min(260px, 55vw);
  height: min(260px, 55vw);
  margin-top: 8px;
}

#controls button {
  appearance: none;
  -webkit-appearance: none;
  border: 3px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,204,0,0.15);
  color: #ffcc00;
  font-family: 'Press Start 2P', monospace;
  font-size: min(5vw, 22px);
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

#controls button:active,
#controls button.pressed {
  background: rgba(255,204,0,0.5);
  box-shadow: 0 0 10px #ffcc0066;
}

#btn-up    { grid-area: up; }
#btn-down  { grid-area: down; }
#btn-left  { grid-area: left; }
#btn-right { grid-area: right; }

/* ---- KEYBOARD-ONLY: hide d-pad if fine pointer ---- */
@media (pointer: fine) and (hover: hover) {
  #controls { display: none; }
}
</style>
</head>
<body>

<!-- Game canvas (sized by JS) -->
<div id="game-area">
  <canvas id="game"></canvas>

  <div class="overlay" id="title-screen">
    <div class="poop-art">💩</div>
    <h1>POOP-ER</h1>
    <div class="subtitle">~ THE INFINITE FROGGER ~</div>
    <div class="blink">TAP TO START</div>
    <div class="controls-info">
      SWIPE OR D-PAD TO MOVE<br>
      CROSS ROADS & PEE RIVERS<br>
      AVOID TOILETS &bull; RIDE TOILET PAPER
    </div>
  </div>

  <div class="overlay hidden" id="game-over-screen">
    <h2>FLUSHED!</h2>
    <div class="final-score" id="final-score">SCORE: 0</div>
    <div class="new-hi hidden" id="new-hi">NEW HIGH SCORE!</div>
    <div class="blink">TAP TO RETRY</div>
  </div>
</div>

<!-- D-Pad (below the game canvas, outside it) -->
<div id="controls">
  <button id="btn-up" aria-label="Up">&#9650;</button>
  <button id="btn-left" aria-label="Left">&#9664;</button>
  <button id="btn-right" aria-label="Right">&#9654;</button>
  <button id="btn-down" aria-label="Down">&#9660;</button>
</div>

<script>
// ============================================================
// POOP-ER  –  Infinite Frogger  –  Mobile-First
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- responsive sizing ----------
const TILE = 32;
const COLS = 13;
const VISIBLE_ROWS = 16;
const GW = COLS * TILE;        // internal game width  (416)
const GH = VISIBLE_ROWS * TILE; // internal game height (512)
canvas.width = GW;
canvas.height = GH;

function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // Compute available height: subtract d-pad (if visible) + padding
  const controlsEl = document.getElementById('controls');
  const controlsVisible = getComputedStyle(controlsEl).display !== 'none';
  const controlsH = controlsVisible ? Math.min(260, vw * 0.55) + 28 : 0;
  const safeTop = parseInt(getComputedStyle(document.body).paddingTop) || 0;
  const safeBot = parseInt(getComputedStyle(document.body).paddingBottom) || 0;
  const availH = vh - controlsH - safeTop - safeBot - 8;
  const availW = vw - 12;

  // Scale canvas to fit, preserving aspect ratio
  const aspect = GW / GH;
  let drawW, drawH;
  if (availW / availH > aspect) {
    drawH = availH;
    drawW = drawH * aspect;
  } else {
    drawW = availW;
    drawH = drawW / aspect;
  }

  const area = document.getElementById('game-area');
  area.style.width = drawW + 'px';
  area.style.height = drawH + 'px';
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ---------- state ----------
let gameState = 'title';
let score = 0;
let hiScore = parseInt(localStorage.getItem('pooper-hi') || '0');
let lives = 3;
let deathTimer = 0;
let scrollOffset = 0;
let targetScrollSpeed = 0.4;
let furthestRow = 0;
let rowsGenerated = 0;
let lanes = [];
let player = { col: 6, row: 0, x: 0, y: 0, riding: null, dead: false };
let particles = [];
let frameCount = 0;

// ---------- audio ----------
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS requires resume inside a user gesture
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    switch (type) {
      case 'hop':
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.linearRampToValueAtTime(400, t + 0.08);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
        break;
      case 'die':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.linearRampToValueAtTime(80, t + 0.4);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.4);
        osc.start(t); osc.stop(t + 0.4);
        break;
      case 'score':
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(550, t + 0.08);
        osc.frequency.setValueAtTime(660, t + 0.16);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
        break;
      case 'gameover':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        osc.frequency.setValueAtTime(250, t + 0.35);
        osc.frequency.linearRampToValueAtTime(50, t + 0.7);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.7);
        osc.start(t); osc.stop(t + 0.7);
        break;
    }
  } catch (_) { /* ignore audio errors */ }
}

// ============================================================
// PIXEL ART SPRITES
// ============================================================

function drawPixelPoop(x, y, size) {
  const s = size / 8;
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x+2*s,y+5*s,4*s,3*s);
  ctx.fillRect(x+1*s,y+6*s,6*s,2*s);
  ctx.fillStyle = '#A0522D';
  ctx.fillRect(x+2*s,y+3*s,4*s,2*s);
  ctx.fillRect(x+3*s,y+2*s,3*s,1*s);
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x+3*s,y+1*s,2*s,1*s);
  ctx.fillRect(x+4*s,y+0*s,1*s,1*s);
  ctx.fillStyle = '#D2691E';
  ctx.fillRect(x+2*s,y+4*s,1*s,1*s);
  ctx.fillRect(x+3*s,y+2*s,1*s,1*s);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x+2*s,y+4*s,2*s,1*s);
  ctx.fillRect(x+5*s,y+4*s,2*s,1*s);
  ctx.fillStyle = '#000';
  ctx.fillRect(x+3*s,y+4*s,1*s,1*s);
  ctx.fillRect(x+6*s,y+4*s,1*s,1*s);
  ctx.fillStyle = '#000';
  ctx.fillRect(x+3*s,y+6*s,3*s,1*s);
  ctx.fillRect(x+2*s,y+5*s,1*s,1*s);
  ctx.fillRect(x+6*s,y+5*s,1*s,1*s);
}

function drawPixelToilet(x, y, size, dir) {
  const s = size / 10;
  ctx.fillStyle = '#E8E8E8';
  ctx.fillRect(x+1*s,y+5*s,8*s,4*s);
  ctx.fillRect(x+2*s,y+4*s,6*s,1*s);
  ctx.fillRect(x+2*s,y+9*s,6*s,1*s);
  ctx.fillStyle = '#D0D0D0';
  if (dir > 0) ctx.fillRect(x,y+2*s,3*s,6*s);
  else ctx.fillRect(x+7*s,y+2*s,3*s,6*s);
  ctx.fillStyle = '#F0F0F0';
  ctx.fillRect(x+1*s,y+3*s,8*s,2*s);
  ctx.fillStyle = '#4488CC';
  ctx.fillRect(x+2*s,y+6*s,6*s,2*s);
  ctx.fillStyle = '#C0C0C0';
  if (dir > 0) ctx.fillRect(x,y+3*s,1*s,1*s);
  else ctx.fillRect(x+9*s,y+3*s,1*s,1*s);
  ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
  ctx.strokeRect(x+1*s,y+3*s,8*s,7*s);
}

function drawToiletPaper(x, y, size) {
  const s = size / 8;
  ctx.fillStyle = '#F5F5F0';
  ctx.fillRect(x+1*s,y+2*s,6*s,4*s);
  ctx.fillStyle = '#D2B48C';
  ctx.fillRect(x+3*s,y+3*s,2*s,2*s);
  ctx.fillStyle = '#FAFAF5';
  ctx.fillRect(x+6*s,y+3*s,2*s,2*s);
  ctx.fillRect(x+7*s,y+4*s,1*s,2*s);
  ctx.fillStyle = '#DDD';
  ctx.fillRect(x+2*s,y+2*s,1*s,1*s);
  ctx.fillRect(x+5*s,y+2*s,1*s,1*s);
  ctx.fillRect(x+2*s,y+5*s,1*s,1*s);
  ctx.fillRect(x+5*s,y+5*s,1*s,1*s);
}

function drawRubberDucky(x, y, size) {
  const s = size / 8;
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(x+2*s,y+3*s,5*s,4*s);
  ctx.fillRect(x+1*s,y+4*s,7*s,2*s);
  ctx.fillRect(x+4*s,y+1*s,3*s,3*s);
  ctx.fillStyle = '#FF8C00';
  ctx.fillRect(x+7*s,y+2*s,1*s,1*s);
  ctx.fillStyle = '#000';
  ctx.fillRect(x+5*s,y+2*s,1*s,1*s);
}

function drawPlunger(x, y, size) {
  const s = size / 8;
  ctx.fillStyle = '#C4A065';
  ctx.fillRect(x+3*s,y+1*s,2*s,4*s);
  ctx.fillStyle = '#8B0000';
  ctx.fillRect(x+1*s,y+5*s,6*s,2*s);
  ctx.fillRect(x+2*s,y+7*s,4*s,1*s);
  ctx.fillStyle = '#A52A2A';
  ctx.fillRect(x+2*s,y+5*s,1*s,1*s);
}

function drawSplash(x, y, size, color) {
  const s = size / 8;
  ctx.fillStyle = color;
  ctx.fillRect(x+3*s,y,2*s,1*s);
  ctx.fillRect(x+1*s,y+1*s,1*s,1*s);
  ctx.fillRect(x+6*s,y+1*s,1*s,1*s);
  ctx.fillRect(x,y+3*s,1*s,2*s);
  ctx.fillRect(x+7*s,y+3*s,1*s,2*s);
  ctx.fillRect(x+2*s,y+2*s,4*s,4*s);
  ctx.fillRect(x+1*s,y+6*s,1*s,1*s);
  ctx.fillRect(x+6*s,y+6*s,1*s,1*s);
  ctx.fillRect(x+3*s,y+7*s,2*s,1*s);
}

// ============================================================
// LANE GENERATION
// ============================================================

function generateLane(rowIndex) {
  if (rowIndex % 5 === 0) {
    return { type:'safe', row:rowIndex, color:'#2d5a1e', obstacles:[], platforms:[], speed:0, direction:0 };
  }
  const difficulty = Math.min(rowIndex / 50, 1);

  if (Math.random() < 0.55) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = (0.5 + Math.random()*1.5 + difficulty) * dir;
    const n = 2 + Math.floor(Math.random()*3 + difficulty*2);
    const obs = [];
    for (let i = 0; i < n; i++) {
      obs.push({ x: i*(GW/n) + Math.random()*40-20, width: TILE*(0.9+Math.random()*0.3), type: Math.random()<0.15?'plunger':'toilet' });
    }
    return { type:'road', row:rowIndex, color:'#444', lineColor:'#666', obstacles:obs, speed, direction:dir };
  } else {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = (0.3 + Math.random() + difficulty*0.5) * dir;
    const n = 2 + Math.floor(Math.random()*2);
    const plats = [];
    for (let i = 0; i < n; i++) {
      plats.push({ x: i*(GW/n)+Math.random()*30, width: TILE*(1.2+Math.random()*1.5), type: Math.random()<0.3?'ducky':'tp' });
    }
    return { type:'river', row:rowIndex, color:'#CCAA00', waveOffset:Math.random()*100, platforms:plats, speed, direction:dir };
  }
}

function ensureLanes() {
  const topRow = Math.floor(scrollOffset/TILE) - 2;
  const bottomRow = topRow + VISIBLE_ROWS + 4;
  while (rowsGenerated <= bottomRow + 10) { lanes.push(generateLane(rowsGenerated)); rowsGenerated++; }
  while (lanes.length > 0 && lanes[0].row < topRow - 5) lanes.shift();
}

// ============================================================
// RENDERING
// ============================================================

function screenY(row) { return GH - (row*TILE - scrollOffset) - TILE; }

function drawLane(lane) {
  const sy = screenY(lane.row);
  if (sy < -TILE*2 || sy > GH+TILE) return;

  if (lane.type === 'safe') {
    ctx.fillStyle = lane.color;
    ctx.fillRect(0,sy,GW,TILE);
    ctx.fillStyle = '#3a7a28';
    for (let gx=0;gx<COLS;gx++) {
      if ((gx+lane.row)%3===0) { ctx.fillRect(gx*TILE+4,sy+4,2,4); ctx.fillRect(gx*TILE+14,sy+10,2,3); }
      if ((gx+lane.row)%5===0) ctx.fillRect(gx*TILE+22,sy+6,2,5);
    }
    if (lane.row%10===0) {
      ctx.fillStyle='#FF69B4'; ctx.fillRect(3*TILE+8,sy+8,4,4);
      ctx.fillStyle='#FF4500'; ctx.fillRect(9*TILE+12,sy+10,4,4);
    }
  } else if (lane.type === 'road') {
    ctx.fillStyle = lane.color; ctx.fillRect(0,sy,GW,TILE);
    ctx.fillStyle = lane.lineColor; ctx.fillRect(0,sy,GW,1); ctx.fillRect(0,sy+TILE-1,GW,1);
    ctx.fillStyle = '#888';
    for (let dx=0;dx<GW;dx+=24) ctx.fillRect(dx+((frameCount*Math.abs(lane.speed)*0.5)%24),sy+TILE/2-1,12,2);
    ctx.fillStyle = '#777'; ctx.fillRect(0,sy,GW,2); ctx.fillRect(0,sy+TILE-2,GW,2);
    for (const o of lane.obstacles) {
      if (o.type==='plunger') drawPlunger(o.x,sy+2,TILE-4);
      else drawPixelToilet(o.x,sy+1,TILE-2,lane.direction);
    }
  } else {
    ctx.fillStyle = lane.color; ctx.fillRect(0,sy,GW,TILE);
    const wp = frameCount*0.05+lane.waveOffset;
    ctx.fillStyle = '#DDBB00';
    for (let wx=0;wx<GW;wx+=8) { const wy=Math.sin(wp+wx*0.1)*2; ctx.fillRect(wx,sy+10+wy,6,2); ctx.fillRect(wx+4,sy+20+wy*0.7,5,2); }
    ctx.fillStyle = '#BB9900';
    for (let wx=0;wx<GW;wx+=16) { const wy=Math.cos(wp+wx*0.08)*3; ctx.fillRect(wx+2,sy+6+wy,4,2); }
    ctx.fillStyle = '#EEDD44';
    for (let bx=0;bx<GW;bx+=40) { const by=Math.sin(wp*1.3+bx)*4; ctx.fillRect(bx+10,sy+14+by,3,3); }
    for (const p of lane.platforms) {
      const segs = Math.ceil(p.width/TILE);
      for (let s=0;s<segs;s++) {
        if (p.type==='ducky') drawRubberDucky(p.x+s*TILE,sy+2,TILE-4);
        else drawToiletPaper(p.x+s*TILE,sy+2,TILE-4);
      }
    }
  }
}

function drawPlayer() {
  if (player.dead) return;
  const px = player.col*TILE + player.x;
  const py = screenY(player.row) + player.y;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px+4,py+TILE-4,TILE-8,4);
  drawPixelPoop(px+2,py+2,TILE-4);
}

function drawDeathEffect() {
  if (deathTimer <= 0) return;
  const px = player.col*TILE + player.x;
  const py = screenY(player.row) + player.y;
  const progress = 1-(deathTimer/60);
  ctx.globalAlpha = 1-progress;
  drawSplash(px-4,py-4,TILE+progress*20,'#8B4513');
  ctx.globalAlpha = 1;
  for (const p of particles) { ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); }
}

function drawHUD() {
  ctx.save();
  ctx.font = '10px "Press Start 2P", monospace';
  // Score
  ctx.fillStyle = '#000'; ctx.fillText('SCORE: '+score, 9, 15);
  ctx.fillStyle = '#ffcc00'; ctx.fillText('SCORE: '+score, 8, 14);
  // Hi
  const hiText = 'HI: '+hiScore;
  const hiW = ctx.measureText(hiText).width;
  ctx.fillStyle = '#000'; ctx.fillText(hiText, GW-hiW-7, 15);
  ctx.fillStyle = '#ff6600'; ctx.fillText(hiText, GW-hiW-8, 14);
  // Lives
  ctx.font = '12px sans-serif';
  let lx = 8;
  for (let i=0;i<lives;i++) { ctx.fillText('💩', lx, 30); lx += 18; }
  ctx.restore();
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y=0;y<GH;y+=3) ctx.fillRect(0,y,GW,1);
}

function render() {
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,GW,GH);
  for (const l of lanes) drawLane(l);
  drawPlayer();
  drawDeathEffect();
  drawHUD();
  drawScanlines();
}

// ============================================================
// GAME LOGIC
// ============================================================

function updateObstacles() {
  for (const lane of lanes) {
    const items = lane.type==='road' ? lane.obstacles : lane.type==='river' ? lane.platforms : null;
    if (!items) continue;
    for (const o of items) {
      o.x += lane.speed;
      if (lane.speed>0 && o.x > GW+TILE) o.x = -o.width;
      if (lane.speed<0 && o.x < -o.width) o.x = GW+TILE;
    }
  }
}

function getLane(row) { return lanes.find(l => l.row === row); }

function checkCollisions() {
  if (player.dead) return;
  const lane = getLane(player.row);
  if (!lane) return;
  const px = player.col*TILE + player.x;
  const pL = px+4, pR = px+TILE-4;

  if (lane.type === 'road') {
    for (const o of lane.obstacles) {
      if (pR > o.x+4 && pL < o.x+o.width-4) { killPlayer(); return; }
    }
  } else if (lane.type === 'river') {
    let on = false; player.riding = null;
    for (const p of lane.platforms) {
      if (pR > p.x+4 && pL < p.x+p.width-4) { on=true; player.riding={platform:p,lane}; break; }
    }
    if (!on) { killPlayer(); return; }
  }
  if (px < -TILE/2 || px > GW-TILE/2) killPlayer();
}

function killPlayer() {
  if (player.dead) return;
  player.dead = true; deathTimer = 60;
  playSound('die');
  const cx = player.col*TILE+player.x+TILE/2, cy = screenY(player.row)+TILE/2;
  particles = [];
  const colors = ['#8B4513','#A0522D','#D2691E','#654321'];
  for (let i=0;i<12;i++) particles.push({ x:cx, y:cy, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5-2, size:2+Math.random()*4, color:colors[Math.floor(Math.random()*4)] });
  lives--;
}

function respawnPlayer() {
  player.dead=false; player.riding=null; player.x=0; player.y=0;
  const center = Math.floor(scrollOffset/TILE)+VISIBLE_ROWS/2;
  let best=null, bd=Infinity;
  for (const l of lanes) { if (l.type==='safe') { const d=Math.abs(l.row-center); if(d<bd){bd=d;best=l;} } }
  if (best) { player.row=best.row; player.col=6; }
}

function movePlayer(dx, dy) {
  if (player.dead || gameState !== 'playing') return;
  const nc = player.col+dx, nr = player.row+dy;
  if (nc<0||nc>=COLS) return;
  player.col=nc; player.row=nr; player.x=0; player.y=0; player.riding=null;
  playSound('hop');
  if (nr > furthestRow) { score += (nr-furthestRow)*10; furthestRow=nr; playSound('score'); }
}

// ============================================================
// GAME LOOP
// ============================================================

function update() {
  frameCount++;
  if (gameState !== 'playing') return;
  ensureLanes();
  updateObstacles();
  if (player.riding && !player.dead) player.x += player.riding.lane.speed;
  const ts = (player.row - VISIBLE_ROWS*0.35)*TILE;
  if (ts > scrollOffset) scrollOffset += (ts-scrollOffset)*0.1;
  scrollOffset += targetScrollSpeed;
  targetScrollSpeed = 0.4 + Math.min(score/2000, 1);
  if (screenY(player.row) > GH+TILE && !player.dead) killPlayer();
  checkCollisions();
  if (player.dead) {
    deathTimer--;
    for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; }
    if (deathTimer <= 0) {
      if (lives <= 0) {
        gameState = 'gameover'; playSound('gameover');
        if (score > hiScore) { hiScore=score; localStorage.setItem('pooper-hi',''+hiScore); document.getElementById('new-hi').classList.remove('hidden'); }
        document.getElementById('final-score').textContent = 'SCORE: '+score;
        document.getElementById('game-over-screen').classList.remove('hidden');
      } else respawnPlayer();
    }
  }
}

function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }

function startGame() {
  score=0; lives=3; furthestRow=0; scrollOffset=0; targetScrollSpeed=0.4; rowsGenerated=0;
  lanes=[]; particles=[]; deathTimer=0;
  player = { col:6, row:0, x:0, y:0, riding:null, dead:false };
  for (let i=0;i<VISIBLE_ROWS+20;i++) { lanes.push(generateLane(i)); rowsGenerated=i+1; }
  lanes[0].type='safe'; lanes[0].color='#2d5a1e';
  gameState = 'playing';
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('new-hi').classList.add('hidden');
}

// ============================================================
// INPUT  –  touch-first
// ============================================================

// ---- Overlays: tap to start / retry ----
function onOverlayTap(e) {
  e.preventDefault(); e.stopPropagation();
  initAudio();
  startGame();
}
// Use touchend (not click) so iOS Safari fires it immediately
['title-screen','game-over-screen'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('touchend', onOverlayTap, { passive: false });
  el.addEventListener('click', onOverlayTap); // fallback for mouse / desktop
});

// ---- D-Pad buttons ----
const dpadMap = { 'btn-up':[0,1], 'btn-down':[0,-1], 'btn-left':[-1,0], 'btn-right':[1,0] };
Object.keys(dpadMap).forEach(id => {
  const btn = document.getElementById(id);
  const handler = (e) => {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    if (gameState === 'title' || gameState === 'gameover') { startGame(); return; }
    movePlayer(dpadMap[id][0], dpadMap[id][1]);
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 120);
  };
  btn.addEventListener('touchstart', handler, { passive: false });
  btn.addEventListener('mousedown', handler);
});

// ---- Swipe on game area ----
let swipeId = null, swipeX = 0, swipeY = 0, swipeT = 0;

document.getElementById('game-area').addEventListener('touchstart', (e) => {
  // Ignore if an overlay is visible (handled separately)
  if (gameState !== 'playing') return;
  if (swipeId !== null) return; // only track one finger
  const t = e.changedTouches[0];
  swipeId = t.identifier;
  swipeX = t.clientX;
  swipeY = t.clientY;
  swipeT = Date.now();
  initAudio();
}, { passive: true });

document.getElementById('game-area').addEventListener('touchend', (e) => {
  if (gameState !== 'playing') return;
  for (let i=0;i<e.changedTouches.length;i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== swipeId) continue;
    swipeId = null;
    const dx = t.clientX - swipeX;
    const dy = t.clientY - swipeY;
    const dt = Date.now() - swipeT;
    const dist = Math.sqrt(dx*dx+dy*dy);
    // Need at least 20px swipe within 400ms
    if (dist < 20 || dt > 400) return;
    if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx>0?1:-1, 0);
    else movePlayer(0, dy<0?1:-1);
  }
}, { passive: true });

// ---- Keyboard (desktop fallback) ----
const keys = {};
document.addEventListener('keydown', (e) => {
  if (keys[e.code]) return;
  keys[e.code] = true;
  initAudio();
  if (gameState==='title'||gameState==='gameover') { if(e.code==='Space'||e.code==='Enter') startGame(); return; }
  if (gameState==='playing') {
    switch(e.code) {
      case 'ArrowUp': case 'KeyW': movePlayer(0,1); break;
      case 'ArrowDown': case 'KeyS': movePlayer(0,-1); break;
      case 'ArrowLeft': case 'KeyA': movePlayer(-1,0); break;
      case 'ArrowRight': case 'KeyD': movePlayer(1,0); break;
    }
  }
  e.preventDefault();
});
document.addEventListener('keyup', (e) => { keys[e.code]=false; });

// ---- Prevent iOS pull-to-refresh / bounce ----
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

// ============================================================
// INIT
// ============================================================
gameLoop();
</script>
</body>
</html>
