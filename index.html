<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POOP-ER - The Infinite Frogger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Press Start 2P', monospace;
  overflow: hidden;
  image-rendering: pixelated;
}

#game-wrapper {
  position: relative;
  border: 4px solid #ffcc00;
  box-shadow: 0 0 20px #ffcc0066, 0 0 60px #ffcc0022;
}

canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}

#score-display {
  position: absolute;
  top: 8px; left: 8px;
  color: #ffcc00;
  font-size: 10px;
  text-shadow: 2px 2px #000;
  z-index: 11;
}

#hi-score-display {
  position: absolute;
  top: 8px; right: 8px;
  color: #ff6600;
  font-size: 10px;
  text-shadow: 2px 2px #000;
  z-index: 11;
}

#lives-display {
  position: absolute;
  top: 24px; left: 8px;
  color: #ff4444;
  font-size: 10px;
  text-shadow: 2px 2px #000;
  z-index: 11;
}

#title-screen, #game-over-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
  z-index: 20;
  pointer-events: all;
}

#title-screen h1 {
  font-size: 28px;
  color: #8B6914;
  text-shadow: 3px 3px #000, -1px -1px #ffcc00;
  margin-bottom: 10px;
  animation: pulse 1.5s infinite;
}

#title-screen .subtitle {
  font-size: 9px;
  color: #ffcc00;
  margin-bottom: 30px;
}

#title-screen .poop-art {
  font-size: 48px;
  margin-bottom: 20px;
  animation: bounce 0.8s infinite alternate;
}

.blink {
  font-size: 11px;
  color: #fff;
  animation: blink 1s infinite;
  margin-top: 20px;
}

.controls-info {
  font-size: 7px;
  color: #888;
  margin-top: 15px;
  text-align: center;
  line-height: 1.8;
}

#game-over-screen h2 {
  font-size: 22px;
  color: #ff4444;
  text-shadow: 2px 2px #000;
  margin-bottom: 15px;
}

#game-over-screen .final-score {
  font-size: 12px;
  color: #ffcc00;
  margin-bottom: 8px;
}

#game-over-screen .new-hi {
  font-size: 10px;
  color: #ff6600;
  animation: pulse 0.5s infinite;
  margin-bottom: 15px;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

/* Mobile controls */
#mobile-controls {
  display: none;
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  pointer-events: all;
}

.d-pad {
  display: grid;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  gap: 4px;
}

.d-pad button {
  width: 48px; height: 48px;
  background: rgba(255,204,0,0.3);
  border: 2px solid #ffcc00;
  color: #ffcc00;
  font-size: 18px;
  font-family: 'Press Start 2P', monospace;
  cursor: pointer;
  pointer-events: all;
  -webkit-tap-highlight-color: transparent;
}

.d-pad button:active {
  background: rgba(255,204,0,0.6);
}

#btn-up { grid-area: up; }
#btn-down { grid-area: down; }
#btn-left { grid-area: left; }
#btn-right { grid-area: right; }

@media (pointer: coarse) {
  #mobile-controls { display: block; }
}
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div id="score-display">SCORE: 0</div>
    <div id="hi-score-display">HI: 0</div>
    <div id="lives-display"></div>

    <div id="title-screen">
      <div class="poop-art">💩</div>
      <h1>POOP-ER</h1>
      <div class="subtitle">~ THE INFINITE FROGGER ~</div>
      <div class="blink">PRESS SPACE OR TAP TO START</div>
      <div class="controls-info">
        ARROW KEYS / WASD TO MOVE<br>
        CROSS ROADS AND PEE RIVERS<br>
        AVOID TOILETS - RIDE TOILET PAPER
      </div>
    </div>

    <div id="game-over-screen" style="display:none;">
      <h2>FLUSHED!</h2>
      <div class="final-score" id="final-score">SCORE: 0</div>
      <div class="new-hi" id="new-hi" style="display:none;">NEW HIGH SCORE!</div>
      <div class="blink">PRESS SPACE OR TAP TO RETRY</div>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="d-pad">
      <button id="btn-up">^</button>
      <button id="btn-left">&lt;</button>
      <button id="btn-right">&gt;</button>
      <button id="btn-down">v</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// POOP-ER: Infinite Frogger with Poop Emoji
// 80s Pixel Art Style
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Game constants
const TILE = 32;
const COLS = 13;
const VISIBLE_ROWS = 16;
const W = COLS * TILE;
const H = VISIBLE_ROWS * TILE;
canvas.width = W;
canvas.height = H;

// State
let gameState = 'title'; // title, playing, dead, gameover
let score = 0;
let hiScore = parseInt(localStorage.getItem('pooper-hi') || '0');
let lives = 3;
let deathTimer = 0;
let scrollOffset = 0;
let scrollSpeed = 0;
let targetScrollSpeed = 0.4;
let furthestRow = 0;
let rowsGenerated = 0;
let lanes = [];
let player = { col: 6, row: 0, x: 0, y: 0, riding: null, dead: false };
let particles = [];
let frameCount = 0;

// Audio context for retro sounds
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;

  switch(type) {
    case 'hop':
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.linearRampToValueAtTime(400, t + 0.08);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
      break;
    case 'die':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.linearRampToValueAtTime(80, t + 0.4);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.4);
      osc.start(t); osc.stop(t + 0.4);
      break;
    case 'score':
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.setValueAtTime(550, t + 0.08);
      osc.frequency.setValueAtTime(660, t + 0.16);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);
      break;
    case 'gameover':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.linearRampToValueAtTime(100, t + 0.3);
      osc.frequency.setValueAtTime(250, t + 0.35);
      osc.frequency.linearRampToValueAtTime(50, t + 0.7);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.7);
      osc.start(t); osc.stop(t + 0.7);
      break;
  }
}

// ============================================================
// PIXEL ART SPRITE DRAWING
// ============================================================

function drawPixelPoop(x, y, size) {
  const s = size / 8;
  ctx.save();

  // Main brown body
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x + 2*s, y + 5*s, 4*s, 3*s);
  ctx.fillRect(x + 1*s, y + 6*s, 6*s, 2*s);

  // Middle swirl
  ctx.fillStyle = '#A0522D';
  ctx.fillRect(x + 2*s, y + 3*s, 4*s, 2*s);
  ctx.fillRect(x + 3*s, y + 2*s, 3*s, 1*s);

  // Top swirl
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x + 3*s, y + 1*s, 2*s, 1*s);
  ctx.fillRect(x + 4*s, y + 0*s, 1*s, 1*s);

  // Highlight
  ctx.fillStyle = '#D2691E';
  ctx.fillRect(x + 2*s, y + 4*s, 1*s, 1*s);
  ctx.fillRect(x + 3*s, y + 2*s, 1*s, 1*s);

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 2*s, y + 4*s, 2*s, 1*s);
  ctx.fillRect(x + 5*s, y + 4*s, 2*s, 1*s);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 3*s, y + 4*s, 1*s, 1*s);
  ctx.fillRect(x + 6*s, y + 4*s, 1*s, 1*s);

  // Smile
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 3*s, y + 6*s, 3*s, 1*s);
  ctx.fillRect(x + 2*s, y + 5*s, 1*s, 1*s);
  ctx.fillRect(x + 6*s, y + 5*s, 1*s, 1*s);

  ctx.restore();
}

function drawPixelToilet(x, y, size, direction) {
  const s = size / 10;
  ctx.save();

  // Base / bowl
  ctx.fillStyle = '#E8E8E8';
  ctx.fillRect(x + 1*s, y + 5*s, 8*s, 4*s);
  ctx.fillRect(x + 2*s, y + 4*s, 6*s, 1*s);
  ctx.fillRect(x + 2*s, y + 9*s, 6*s, 1*s);

  // Tank (back)
  ctx.fillStyle = '#D0D0D0';
  if (direction > 0) {
    ctx.fillRect(x + 0*s, y + 2*s, 3*s, 6*s);
  } else {
    ctx.fillRect(x + 7*s, y + 2*s, 3*s, 6*s);
  }

  // Lid
  ctx.fillStyle = '#F0F0F0';
  ctx.fillRect(x + 1*s, y + 3*s, 8*s, 2*s);

  // Water inside
  ctx.fillStyle = '#4488CC';
  ctx.fillRect(x + 2*s, y + 6*s, 6*s, 2*s);

  // Handle
  ctx.fillStyle = '#C0C0C0';
  if (direction > 0) {
    ctx.fillRect(x + 0*s, y + 3*s, 1*s, 1*s);
  } else {
    ctx.fillRect(x + 9*s, y + 3*s, 1*s, 1*s);
  }

  // Outline
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 1*s, y + 3*s, 8*s, 7*s);

  ctx.restore();
}

function drawToiletPaper(x, y, size) {
  const s = size / 8;
  ctx.save();

  // Roll
  ctx.fillStyle = '#F5F5F0';
  ctx.fillRect(x + 1*s, y + 2*s, 6*s, 4*s);

  // Center hole
  ctx.fillStyle = '#D2B48C';
  ctx.fillRect(x + 3*s, y + 3*s, 2*s, 2*s);

  // Trailing paper
  ctx.fillStyle = '#FAFAF5';
  ctx.fillRect(x + 6*s, y + 3*s, 2*s, 2*s);
  ctx.fillRect(x + 7*s, y + 4*s, 1*s, 2*s);

  // Perforations
  ctx.fillStyle = '#DDD';
  ctx.fillRect(x + 2*s, y + 2*s, 1*s, 1*s);
  ctx.fillRect(x + 5*s, y + 2*s, 1*s, 1*s);
  ctx.fillRect(x + 2*s, y + 5*s, 1*s, 1*s);
  ctx.fillRect(x + 5*s, y + 5*s, 1*s, 1*s);

  ctx.restore();
}

function drawRubberDucky(x, y, size) {
  const s = size / 8;
  ctx.save();

  // Body
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(x + 2*s, y + 3*s, 5*s, 4*s);
  ctx.fillRect(x + 1*s, y + 4*s, 7*s, 2*s);

  // Head
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(x + 4*s, y + 1*s, 3*s, 3*s);

  // Beak
  ctx.fillStyle = '#FF8C00';
  ctx.fillRect(x + 7*s, y + 2*s, 1*s, 1*s);

  // Eye
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 5*s, y + 2*s, 1*s, 1*s);

  ctx.restore();
}

function drawPlunger(x, y, size) {
  const s = size / 8;
  ctx.save();

  // Stick
  ctx.fillStyle = '#C4A065';
  ctx.fillRect(x + 3*s, y + 1*s, 2*s, 4*s);

  // Cup
  ctx.fillStyle = '#8B0000';
  ctx.fillRect(x + 1*s, y + 5*s, 6*s, 2*s);
  ctx.fillRect(x + 2*s, y + 7*s, 4*s, 1*s);

  // Highlight
  ctx.fillStyle = '#A52A2A';
  ctx.fillRect(x + 2*s, y + 5*s, 1*s, 1*s);

  ctx.restore();
}

function drawSplash(x, y, size, color) {
  const s = size / 8;
  ctx.fillStyle = color;
  ctx.fillRect(x + 3*s, y + 0*s, 2*s, 1*s);
  ctx.fillRect(x + 1*s, y + 1*s, 1*s, 1*s);
  ctx.fillRect(x + 6*s, y + 1*s, 1*s, 1*s);
  ctx.fillRect(x + 0*s, y + 3*s, 1*s, 2*s);
  ctx.fillRect(x + 7*s, y + 3*s, 1*s, 2*s);
  ctx.fillRect(x + 2*s, y + 2*s, 4*s, 4*s);
  ctx.fillRect(x + 1*s, y + 6*s, 1*s, 1*s);
  ctx.fillRect(x + 6*s, y + 6*s, 1*s, 1*s);
  ctx.fillRect(x + 3*s, y + 7*s, 2*s, 1*s);
}

// ============================================================
// LANE GENERATION
// ============================================================

function generateLane(rowIndex) {
  // Pattern: safe -> mix of road/river -> safe zone every ~5 rows
  const isSafe = (rowIndex % 5 === 0);

  if (isSafe) {
    return {
      type: 'safe',
      row: rowIndex,
      color: '#2d5a1e',  // grass green
      obstacles: [],
      platforms: [],
      speed: 0,
      direction: 0
    };
  }

  // Alternate between road and river with some randomness
  const rand = Math.random();
  const difficulty = Math.min(rowIndex / 50, 1); // increases over time

  if (rand < 0.55) {
    // ROAD lane with toilets
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = (0.5 + Math.random() * 1.5 + difficulty * 1.0) * dir;
    const numToilets = 2 + Math.floor(Math.random() * 3 + difficulty * 2);
    const obstacles = [];

    for (let i = 0; i < numToilets; i++) {
      obstacles.push({
        x: (i * (W / numToilets)) + Math.random() * 40 - 20,
        width: TILE * (0.9 + Math.random() * 0.3),
        type: Math.random() < 0.15 ? 'plunger' : 'toilet'
      });
    }

    return {
      type: 'road',
      row: rowIndex,
      color: '#444',
      lineColor: '#666',
      obstacles,
      speed,
      direction: dir
    };
  } else {
    // PEE RIVER with toilet paper / rubber ducky platforms
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = (0.3 + Math.random() * 1.0 + difficulty * 0.5) * dir;
    const numPlatforms = 2 + Math.floor(Math.random() * 2);
    const platforms = [];

    for (let i = 0; i < numPlatforms; i++) {
      const ptype = Math.random() < 0.3 ? 'ducky' : 'tp';
      platforms.push({
        x: i * (W / numPlatforms) + Math.random() * 30,
        width: TILE * (1.2 + Math.random() * 1.5),
        type: ptype
      });
    }

    return {
      type: 'river',
      row: rowIndex,
      color: '#CCAA00',  // pee yellow
      waveOffset: Math.random() * 100,
      platforms,
      speed,
      direction: dir
    };
  }
}

function ensureLanes() {
  // Generate lanes ahead of the player
  const topRow = Math.floor(scrollOffset / TILE) - 2;
  const bottomRow = topRow + VISIBLE_ROWS + 4;

  while (rowsGenerated <= bottomRow + 10) {
    lanes.push(generateLane(rowsGenerated));
    rowsGenerated++;
  }

  // Clean up old lanes far behind
  while (lanes.length > 0 && lanes[0].row < topRow - 5) {
    lanes.shift();
  }
}

// ============================================================
// RENDERING
// ============================================================

function getScreenY(worldRow) {
  return H - (worldRow * TILE - scrollOffset) - TILE;
}

function drawLane(lane) {
  const sy = getScreenY(lane.row);
  if (sy < -TILE * 2 || sy > H + TILE) return;

  if (lane.type === 'safe') {
    // Grass
    ctx.fillStyle = lane.color;
    ctx.fillRect(0, sy, W, TILE);

    // Pixel grass detail
    ctx.fillStyle = '#3a7a28';
    for (let gx = 0; gx < COLS; gx++) {
      if ((gx + lane.row) % 3 === 0) {
        ctx.fillRect(gx * TILE + 4, sy + 4, 2, 4);
        ctx.fillRect(gx * TILE + 14, sy + 10, 2, 3);
      }
      if ((gx + lane.row) % 5 === 0) {
        ctx.fillRect(gx * TILE + 22, sy + 6, 2, 5);
      }
    }

    // Occasional flowers
    if (lane.row % 10 === 0) {
      ctx.fillStyle = '#FF69B4';
      ctx.fillRect(3 * TILE + 8, sy + 8, 4, 4);
      ctx.fillStyle = '#FF4500';
      ctx.fillRect(9 * TILE + 12, sy + 10, 4, 4);
    }

  } else if (lane.type === 'road') {
    // Road surface
    ctx.fillStyle = lane.color;
    ctx.fillRect(0, sy, W, TILE);

    // Road lines (dashed)
    ctx.fillStyle = lane.lineColor;
    ctx.fillRect(0, sy, W, 1);
    ctx.fillRect(0, sy + TILE - 1, W, 1);

    // Center dashes
    ctx.fillStyle = '#888';
    for (let dx = 0; dx < W; dx += 24) {
      ctx.fillRect(dx + ((frameCount * Math.abs(lane.speed) * 0.5) % 24), sy + TILE/2 - 1, 12, 2);
    }

    // Sidewalk edges
    ctx.fillStyle = '#777';
    ctx.fillRect(0, sy, W, 2);
    ctx.fillRect(0, sy + TILE - 2, W, 2);

    // Draw toilet obstacles
    for (const obs of lane.obstacles) {
      if (obs.type === 'plunger') {
        drawPlunger(obs.x, sy + 2, TILE - 4);
      } else {
        drawPixelToilet(obs.x, sy + 1, TILE - 2, lane.direction);
      }
    }

  } else if (lane.type === 'river') {
    // Pee river background
    ctx.fillStyle = lane.color;
    ctx.fillRect(0, sy, W, TILE);

    // Animated wave pattern
    const wavePhase = frameCount * 0.05 + lane.waveOffset;
    ctx.fillStyle = '#DDBB00';
    for (let wx = 0; wx < W; wx += 8) {
      const wy = Math.sin(wavePhase + wx * 0.1) * 2;
      ctx.fillRect(wx, sy + 10 + wy, 6, 2);
      ctx.fillRect(wx + 4, sy + 20 + wy * 0.7, 5, 2);
    }

    // Darker wave accents
    ctx.fillStyle = '#BB9900';
    for (let wx = 0; wx < W; wx += 16) {
      const wy = Math.cos(wavePhase + wx * 0.08) * 3;
      ctx.fillRect(wx + 2, sy + 6 + wy, 4, 2);
    }

    // Bubbles
    ctx.fillStyle = '#EEDD44';
    for (let bx = 0; bx < W; bx += 40) {
      const by = Math.sin(wavePhase * 1.3 + bx) * 4;
      ctx.fillRect(bx + 10, sy + 14 + by, 3, 3);
    }

    // Draw platforms (toilet paper / ducky)
    for (const plat of lane.platforms) {
      const pw = plat.width;
      const numSegments = Math.ceil(pw / TILE);
      for (let s = 0; s < numSegments; s++) {
        if (plat.type === 'ducky') {
          drawRubberDucky(plat.x + s * TILE, sy + 2, TILE - 4);
        } else {
          drawToiletPaper(plat.x + s * TILE, sy + 2, TILE - 4);
        }
      }
    }
  }
}

function drawPlayer() {
  if (player.dead) return;

  const px = player.col * TILE + player.x;
  const py = getScreenY(player.row) + player.y;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px + 4, py + TILE - 4, TILE - 8, 4);

  drawPixelPoop(px + 2, py + 2, TILE - 4);
}

function drawDeathEffect() {
  if (deathTimer <= 0) return;
  const px = player.col * TILE + player.x;
  const py = getScreenY(player.row) + player.y;

  // Splash effect
  const progress = 1 - (deathTimer / 60);
  const alpha = 1 - progress;
  ctx.globalAlpha = alpha;
  const splashSize = TILE + progress * 20;
  drawSplash(px - 4, py - 4, splashSize, '#8B4513');
  ctx.globalAlpha = 1;

  // Flying particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let sy = 0; sy < H; sy += 3) {
    ctx.fillRect(0, sy, W, 1);
  }
}

function drawVignette() {
  const gradient = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.75);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

function render() {
  // Clear
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  // Draw all visible lanes
  for (const lane of lanes) {
    drawLane(lane);
  }

  drawPlayer();
  drawDeathEffect();
  drawScanlines();
  drawVignette();
}

// ============================================================
// GAME LOGIC
// ============================================================

function updateObstacles() {
  for (const lane of lanes) {
    if (lane.type === 'road') {
      for (const obs of lane.obstacles) {
        obs.x += lane.speed;
        // Wrap around
        if (lane.speed > 0 && obs.x > W + TILE) obs.x = -obs.width;
        if (lane.speed < 0 && obs.x < -obs.width) obs.x = W + TILE;
      }
    } else if (lane.type === 'river') {
      for (const plat of lane.platforms) {
        plat.x += lane.speed;
        if (lane.speed > 0 && plat.x > W + TILE) plat.x = -plat.width;
        if (lane.speed < 0 && plat.x < -plat.width) plat.x = W + TILE;
      }
    }
  }
}

function getLane(row) {
  return lanes.find(l => l.row === row);
}

function checkCollisions() {
  if (player.dead) return;

  const lane = getLane(player.row);
  if (!lane) return;

  const px = player.col * TILE + player.x;
  const pw = TILE - 8;
  const playerLeft = px + 4;
  const playerRight = px + pw + 4;

  if (lane.type === 'road') {
    for (const obs of lane.obstacles) {
      const obsLeft = obs.x;
      const obsRight = obs.x + obs.width;
      if (playerRight > obsLeft + 4 && playerLeft < obsRight - 4) {
        killPlayer();
        return;
      }
    }
  } else if (lane.type === 'river') {
    let onPlatform = false;
    player.riding = null;
    for (const plat of lane.platforms) {
      const platLeft = plat.x;
      const platRight = plat.x + plat.width;
      if (playerRight > platLeft + 4 && playerLeft < platRight - 4) {
        onPlatform = true;
        player.riding = { platform: plat, lane };
        break;
      }
    }
    if (!onPlatform) {
      killPlayer();
      return;
    }
  }

  // Check out of bounds horizontally
  if (px < -TILE/2 || px > W - TILE/2) {
    killPlayer();
  }
}

function killPlayer() {
  if (player.dead) return;
  player.dead = true;
  deathTimer = 60;
  playSound('die');

  // Create particles
  const px = player.col * TILE + player.x + TILE/2;
  const py = getScreenY(player.row) + TILE/2;
  particles = [];
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5 - 2,
      size: 2 + Math.random() * 4,
      color: ['#8B4513', '#A0522D', '#D2691E', '#654321'][Math.floor(Math.random()*4)]
    });
  }

  lives--;
}

function respawnPlayer() {
  player.dead = false;
  player.riding = null;
  player.x = 0;
  player.y = 0;

  // Find closest safe lane near current scroll position
  const centerRow = Math.floor(scrollOffset / TILE) + VISIBLE_ROWS / 2;
  let bestLane = null;
  let bestDist = Infinity;
  for (const lane of lanes) {
    if (lane.type === 'safe') {
      const dist = Math.abs(lane.row - centerRow);
      if (dist < bestDist) {
        bestDist = dist;
        bestLane = lane;
      }
    }
  }
  if (bestLane) {
    player.row = bestLane.row;
    player.col = 6;
  }
}

function movePlayer(dx, dy) {
  if (player.dead || gameState !== 'playing') return;

  const newCol = player.col + dx;
  const newRow = player.row + dy;

  // Horizontal bounds
  if (newCol < 0 || newCol >= COLS) return;

  player.col = newCol;
  player.row = newRow;
  player.x = 0;
  player.y = 0;
  player.riding = null;

  playSound('hop');

  // Score for moving forward
  if (newRow > furthestRow) {
    const diff = newRow - furthestRow;
    score += diff * 10;
    furthestRow = newRow;
    if (diff > 0) playSound('score');
  }

  updateUI();
}

function updateUI() {
  document.getElementById('score-display').textContent = 'SCORE: ' + score;
  document.getElementById('hi-score-display').textContent = 'HI: ' + hiScore;

  let livesText = '';
  for (let i = 0; i < lives; i++) livesText += '💩 ';
  document.getElementById('lives-display').textContent = livesText;
}

// ============================================================
// MAIN GAME LOOP
// ============================================================

function update() {
  frameCount++;

  if (gameState !== 'playing') return;

  ensureLanes();
  updateObstacles();

  // Riding platform movement
  if (player.riding && !player.dead) {
    player.x += player.riding.lane.speed;
  }

  // Smooth scroll to follow player
  const targetScroll = (player.row - VISIBLE_ROWS * 0.35) * TILE;
  if (targetScroll > scrollOffset) {
    scrollOffset += (targetScroll - scrollOffset) * 0.1;
  }

  // Auto-scroll slowly pushes forward
  scrollOffset += targetScrollSpeed;
  targetScrollSpeed = 0.4 + Math.min(score / 2000, 1.0);

  // Check if player is pushed off screen (bottom)
  const playerScreenY = getScreenY(player.row);
  if (playerScreenY > H + TILE && !player.dead) {
    killPlayer();
  }

  checkCollisions();

  // Death timer
  if (player.dead) {
    deathTimer--;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
    }
    if (deathTimer <= 0) {
      if (lives <= 0) {
        gameState = 'gameover';
        playSound('gameover');
        if (score > hiScore) {
          hiScore = score;
          localStorage.setItem('pooper-hi', hiScore.toString());
          document.getElementById('new-hi').style.display = 'block';
        }
        document.getElementById('final-score').textContent = 'SCORE: ' + score;
        document.getElementById('game-over-screen').style.display = 'flex';
      } else {
        respawnPlayer();
      }
    }
  }
}

function gameLoop() {
  update();
  render();
  updateUI();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  score = 0;
  lives = 3;
  furthestRow = 0;
  scrollOffset = 0;
  targetScrollSpeed = 0.4;
  rowsGenerated = 0;
  lanes = [];
  particles = [];
  deathTimer = 0;
  player = { col: 6, row: 0, x: 0, y: 0, riding: null, dead: false };

  // Generate initial lanes
  for (let i = 0; i < VISIBLE_ROWS + 20; i++) {
    lanes.push(generateLane(i));
    rowsGenerated = i + 1;
  }
  // Force row 0 to be safe
  lanes[0].type = 'safe';
  lanes[0].color = '#2d5a1e';

  gameState = 'playing';
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  document.getElementById('new-hi').style.display = 'none';

  updateUI();
}

// ============================================================
// INPUT HANDLING
// ============================================================

const keys = {};

document.addEventListener('keydown', (e) => {
  if (keys[e.code]) return;
  keys[e.code] = true;

  initAudio();

  if (gameState === 'title' || gameState === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') {
      startGame();
    }
    return;
  }

  if (gameState === 'playing') {
    switch(e.code) {
      case 'ArrowUp': case 'KeyW':
        movePlayer(0, 1); break;
      case 'ArrowDown': case 'KeyS':
        movePlayer(0, -1); break;
      case 'ArrowLeft': case 'KeyA':
        movePlayer(-1, 0); break;
      case 'ArrowRight': case 'KeyD':
        movePlayer(1, 0); break;
    }
  }

  e.preventDefault();
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// Touch / click for title/gameover
document.getElementById('title-screen').addEventListener('click', () => {
  initAudio();
  startGame();
});
document.getElementById('game-over-screen').addEventListener('click', () => {
  initAudio();
  startGame();
});

// Mobile D-pad
['btn-up', 'btn-down', 'btn-left', 'btn-right'].forEach(id => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    if (gameState !== 'playing') { startGame(); return; }
    switch(id) {
      case 'btn-up': movePlayer(0, 1); break;
      case 'btn-down': movePlayer(0, -1); break;
      case 'btn-left': movePlayer(-1, 0); break;
      case 'btn-right': movePlayer(1, 0); break;
    }
  });
});

// Swipe support
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  initAudio();
});

canvas.addEventListener('touchend', (e) => {
  if (gameState !== 'playing') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const threshold = 30;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > threshold) {
      movePlayer(dx > 0 ? 1 : -1, 0);
    }
  } else {
    if (Math.abs(dy) > threshold) {
      movePlayer(0, dy < 0 ? 1 : -1);
    }
  }
});

// ============================================================
// INIT
// ============================================================

updateUI();
gameLoop();

</script>
</body>
</html>
